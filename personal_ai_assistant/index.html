<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal AI Assistant</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-robot"></i> My AI Assistant
            </div>
            <div class="header-icons">
                <button id="settings-button" class="icon-button" title="Settings"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <main class="chat-container">
            <div id="chat-output" class="chat-output">
                <!-- Messages will appear here -->
                <div class="message ai-message">
                    <p>Hello! I'm your personal AI assistant. How can I help you today?</p>
                </div>
            </div>
        </main>

        <footer>
            <div class="input-area">
                <button id="upload-button" class="icon-button" title="Upload File"><i class="fas fa-plus"></i></button>
                <input type="file" id="file-input" style="display: none;">
                <textarea id="chat-input" placeholder="Type your message..." rows="1"></textarea>
                <button id="send-button" class="icon-button" title="Send"><i class="fas fa-paper-plane"></i></button>
            </div>
        </footer>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-button" id="close-settings-modal">&times;</span>
            <h2><i class="fas fa-cogs"></i> Settings</h2>
            <div class="settings-group">
                <label for="llm-url">LLM Server URL (Ollama/LM Studio):</label>
                <input type="text" id="llm-url" placeholder="http://localhost:11434">
            </div>
            <div class="settings-group">
                <button id="check-models-button">Check Available Models</button>
                <div id="model-status"></div>
            </div>
            <div class="settings-group">
                <label for="model-select">Select AI Model:</label>
                <select id="model-select">
                    <option value="">-- Select a Model --</option>
                </select>
            </div>
            <div class="settings-group">
                <button id="save-settings-button">Save Settings</button>
            </div>

            <hr class="settings-divider">

            <h3 class="settings-subtitle"><i class="fas fa-palette"></i> Theme Options</h3>
            <div class="settings-group">
                <label for="accent-color-select">Accent Color:</label>
                <select id="accent-color-select">
                    <option value="#ff00ff">Magenta (Default)</option>
                    <option value="#00ff00">Lime Green</option>
                    <option value="#ffa500">Orange</option>
                    <option value="#00ffff">Cyan (Matches Border)</option>
                    <option value="#ff5555">Rose Red</option>
                </select>
            </div>

            <hr class="settings-divider">

            <div class="settings-group">
                <button id="clear-chat-history-button" class="danger-button">Clear Chat History</button>
            </div>
        </div>
    </div>

    <script src="assets/libs/marked.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
